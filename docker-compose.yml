services:
  gloomhaven-planer:
    build: .
    container_name: gloomhaven-planer
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      # 1 = Bereich „App aktualisieren“ anzeigen (setzt tools/pi/updates-einrichten.sh in der .env)
      UPDATES_IN_APP: ${UPDATES_IN_APP:-0}
    ports:
      - "${PORT:-8090}:8090"
    # Profile, Hände, Notizen und der Austausch mit dem Update-Dienst liegen im Ordner data
    volumes:
      - ./data:/data
