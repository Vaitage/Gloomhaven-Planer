<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="planer-modus" content="server">
  <meta name="theme-color" content="#18222b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Planer">
  <title>Gloomhaven-Planer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kopf">
    <button id="heldBtn" class="held" type="button" >
      <span class="held-farbe" aria-hidden="true"></span>
      <span class="held-text"><strong id="heldName">Held wählen</strong><small id="heldSub"></small><span class="mini-ep" hidden><i id="miniEp"></i></span></span>
    </button>
    <span id="speicherStatus" class="status" role="status" aria-live="polite"></span>
  </header>

  <main id="ansicht" tabindex="-1"></main>

  <nav class="reiter" aria-label="Bereiche">
    <button type="button" data-tab="szenario" aria-current="page">Szenario</button>
    <button type="button" data-tab="karten">Karten</button>
    <button type="button" data-tab="hand">Hand</button>
    <button type="button" data-tab="plan">Plan</button>
    <button type="button" data-tab="notizen">Notizen</button>
  </nav>

  <dialog id="heldDialog" aria-labelledby="heldDialogTitel"></dialog>
  <dialog id="bildDialog" aria-label="Kartenbild"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
